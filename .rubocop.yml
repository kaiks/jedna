inherit_from: .rubocop_todo.yml

# Preserve TODO exclusions alongside directory-specific exceptions.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 4.0
  # Review pending cops explicitly as part of the gradual lint cleanup.
  NewCops: disable
  SuggestExtensions: false

# Allow cohesive methods and declarative payloads without relaxing complexity checks.
Metrics/MethodLength:
  Max: 15
  CountAsOne: [array, hash, heredoc]

Metrics/ClassLength:
  Max: 150
